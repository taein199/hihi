<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>태인이의 술래잡기 게임</title>
    <!-- PeerJS 및 QRCode 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* 칠흑 같은 어둠 최적화 스타일 */
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; user-select: none; touch-action: none; -webkit-touch-callout: none; }
        button { cursor: pointer; outline: none; border: none; font-weight: bold; font-family: 'Malgun Gothic', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 1. 호스트 화면 스타일 */
        #host-init { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 20; width: 100%; }
        #host-init button { padding: 20px 40px; font-size: 24px; background: #8a0303; color: #fff; border-radius: 8px; border: 2px solid #ff0000; transition: 0.3s; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #host-init button:hover { background: #500000; transform: scale(1.05); }
        
        #host-lobby { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; text-align: center; z-index: 10; background: radial-gradient(circle, #1a0505 0%, #000 80%); }
        #host-lobby h1 { margin-top: 50px; font-size: 50px; color: #ff0000; text-shadow: 0 0 10px #ff0000; letter-spacing: 5px; }
        #host-lobby p { color: #888; font-size: 18px; }
        #qr-container { background: #fff; padding: 15px; margin: 30px auto; display: inline-block; border: 4px solid #8a0303; border-radius: 5px; }
        .player-status { font-size: 24px; margin: 15px; color: #aaa; }
        .ready { color: #ff0000; font-weight: bold; text-shadow: 0 0 5px #ff0000; }
        .wait { color: #555; }

        #host-game { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #111 0%, #000 100%); overflow: hidden; }
        #timer-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 54px; color: #ff3333; font-weight: bold; text-shadow: 0 0 15px #ff0000; z-index: 5; }
        #game-canvas { display: block; width: 100%; height: 100%; }

        /* 2. 클라이언트 컨트롤러 화면 스타일 (모바일 레이아웃 완전 수정) */
        #client-ui { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #000; position: absolute; top:0; left:0; }
        
        #client-lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #client-lobby h2 { font-size: 22px; margin-bottom: 30px; text-align: center; color: #ddd; line-height: 1.6; padding: 0 20px; }
        #btn-ready { padding: 20px 60px; font-size: 26px; background: #222; color: #fff; border-radius: 12px; border: 2px solid #555; transition: 0.3s; }
        #btn-ready.active { background: #8a0303; border-color: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.8); }

        #client-game { display: none; width: 100%; height: 100%; position: relative; background: #050505; overflow: hidden; }
        
        /* 조이스틱 (좌측 하단) */
        #joystick-area { position: absolute; bottom: 8%; left: 5%; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid #333; z-index: 10; }
        #stick { width: 60px; height: 60px; background: #555; border-radius: 50%; position: absolute; top: 45px; left: 45px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        
        /* 달리기 버튼 (조이스틱 바로 위) */
        #btn-sprint { position: absolute; bottom: calc(8% + 170px); left: 8%; width: 90px; height: 60px; border-radius: 30px; background: rgba(200, 200, 200, 0.1); border: 2px solid #888; color: #fff; font-size: 16px; z-index: 10; transition: 0.1s; }
        #btn-sprint.active { background: rgba(255, 0, 0, 0.4); border-color: #ff0000; color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        /* 스킬 버튼 영역 (우측 하단 - 잘리지 않게 플렉스로 배치) */
        #skill-area { position: absolute; bottom: 8%; right: 3%; width: 200px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; z-index: 10; }
        .skill-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(20, 20, 20, 0.8); border: 2px solid #444; color: #fff; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        .skill-btn:active { transform: scale(0.9); border-color: #ff0000; }
        .skill-btn .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(255,0,0,0.6); transition: height 0.1s linear; }
        .skill-name { font-size: 10px; display: block; margin-top: 2px; color: #aaa; pointer-events: none; }
        
        /* 격노 전용 버튼 스타일 */
        #btn-F { width: 150px; border-radius: 20px; background: rgba(138, 3, 3, 0.5); border-color: #ff0000; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- ================= 호스트 UI (PC/태블릿) ================= -->
    <div id="host-init">
        <h2 style="color:#aaa; margin-bottom: 20px;">어둠 속에 숨은 살인마를 피하십시오.</h2>
        <button onclick="initHost()">방 생성하기</button>
    </div>

    <div id="host-lobby">
        <p>생존자와 살인마가 연결되기를 기다리고 있습니다...</p>
        <div id="qr-container"></div>
        <div class="player-status">Player 1: <span id="p1-status" class="wait">연결 대기 중...</span></div>
        <div class="player-status">Player 2: <span id="p2-status" class="wait">연결 대기 중...</span></div>
    </div>

    <div id="host-game">
        <div id="timer-display">01:13</div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- ================= 클라이언트 UI (스마트폰 컨트롤러) ================= -->
    <div id="client-ui">
        <div id="client-lobby">
            <h2 id="role-text">역할을 배정하고 있습니다...</h2>
            <button id="btn-ready">준비</button>
        </div>
        <div id="client-game">
            <div id="joystick-area"><div id="stick"></div></div>
            <button id="btn-sprint">달리기</button>
            
            <div id="skill-area">
                <button class="skill-btn" id="btn-Q" onclick="useSkill('Q')">Q<span class="skill-name" id="name-Q">스킬1</span><div class="cooldown-overlay" id="cd-Q"></div></button>
                <button class="skill-btn" id="btn-E" onclick="useSkill('E')">E<span class="skill-name" id="name-E">스킬2</span><div class="cooldown-overlay" id="cd-E"></div></button>
                <button class="skill-btn" id="btn-R" onclick="useSkill('R')">R<span class="skill-name" id="name-R">스킬3</span><div class="cooldown-overlay" id="cd-R"></div></button>
                <button class="skill-btn" id="btn-F" onclick="useSkill('F')" style="display:none;">F<span class="skill-name">격노한 발걸음</span><div class="cooldown-overlay" id="cd-F"></div></button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostIdToJoin = urlParams.get('join');

        // =========================================================================
        // 1. 클라이언트 (스마트폰 컨트롤러) 로직
        // =========================================================================
        if (hostIdToJoin) {
            document.getElementById('client-ui').style.display = 'flex';
            document.getElementById('host-init').style.display = 'none';

            const peer = new Peer();
            let conn;
            let myRole = ''; 
            let isReady = false;

            const skills = {
                killer: { Q: 1.9, E: 18.5, R: 32, F: 30 },
                survivor: { Q: 27, E: 40, R: 60 }
            };

            peer.on('open', () => {
                conn = peer.connect(hostIdToJoin);
                conn.on('open', () => {
                    conn.on('data', (data) => {
                        if (data.type === 'assign-role') {
                            myRole = data.role;
                            const roleText = document.getElementById('role-text');
                            
                            if (myRole === 'killer') {
                                roleText.innerHTML = "<span style='color:#ff0000; font-size:28px; text-shadow:0 0 10px #ff0000;'>Slasher (살인마)</span><br><br>투박한 하키 마스크로 얼굴을 감춘 자.<br>스태미나 110. 피로 물든 마체테를 휘두르십시오.";
                                document.getElementById('name-Q').innerText = "휘두르기";
                                document.getElementById('name-E').innerText = "참수";
                                document.getElementById('name-R').innerText = "상처/전기톱";
                                document.getElementById('btn-F').style.display = 'block'; 
                                document.body.style.boxShadow = "inset 0 0 50px rgba(255,0,0,0.3)";
                            } else {
                                roleText.innerHTML = "<span style='color:#aaa; font-size:28px;'>Guest 1337 (생존자)</span><br><br>칠흑 같은 어둠 속.<br>스태미나 100. 73초 동안 살인마의 추격을 피하십시오.";
                                document.getElementById('name-Q').innerText = "방어";
                                document.getElementById('name-E').innerText = "돌진";
                                document.getElementById('name-R').innerText = "펀치";
                            }
                        } else if (data.type === 'start-game') {
                            document.getElementById('client-lobby').style.display = 'none';
                            document.getElementById('client-game').style.display = 'block';
                        }
                    });
                });
            });

            // 준비 버튼
            document.getElementById('btn-ready').addEventListener('click', function() {
                if(!conn || !conn.open) return;
                isReady = !isReady;
                this.classList.toggle('active');
                this.innerText = isReady ? "준비 완료!" : "준비";
                conn.send({ type: 'ready', state: isReady });
            });

            // 조이스틱
            const jArea = document.getElementById('joystick-area');
            const stick = document.getElementById('stick');
            let isDragging = false, startX, startY;
            const maxRadius = 45;

            jArea.addEventListener('touchstart', (e) => {
                isDragging = true;
                const rect = jArea.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || !conn || !conn.open) return;
                let dx = e.touches[0].clientX - startX;
                let dy = e.touches[0].clientY - startY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxRadius) { dx = (dx/dist)*maxRadius; dy = (dy/dist)*maxRadius; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                conn.send({ type: 'move', x: dx/maxRadius, y: dy/maxRadius });
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
                stick.style.transform = 'translate(0px, 0px)';
                if (conn && conn.open) conn.send({ type: 'move', x: 0, y: 0 });
            });

            // 달리기 버튼
            const btnSprint = document.getElementById('btn-sprint');
            btnSprint.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(conn && conn.open) conn.send({ type: 'sprint', state: true });
                btnSprint.classList.add('active');
            });
            btnSprint.addEventListener('touchend', (e) => {
                e.preventDefault();
                if(conn && conn.open) conn.send({ type: 'sprint', state: false });
                btnSprint.classList.remove('active');
            });

            // 스킬 버튼
            window.useSkill = function(key) {
                if (!conn || !conn.open) return;
                const cdOverlay = document.getElementById(`cd-${key}`);
                if (cdOverlay.style.height === '100%') return; 

                conn.send({ type: 'skill', key: key });

                const cdTime = skills[myRole][key] * 1000;
                cdOverlay.style.height = '100%';
                cdOverlay.style.transition = 'none';
                
                setTimeout(() => {
                    cdOverlay.style.transition = `height ${cdTime}ms linear`;
                    cdOverlay.style.height = '0%';
                }, 50);
            };

        // =========================================================================
        // 2. 호스트 (태블릿/모니터 메인 뷰) 로직
        // =========================================================================
        } else {
            let peer;
            let p1Conn = null, p2Conn = null;
            let p1Ready = false, p2Ready = false;
            let isP1Killer = Math.random() < 0.5;

            let gameActive = false;
            let timeRemaining = 73; // 73초
            
            // Web Audio API (효과음)
            let audioCtx;
            function initAudio() {
                if(!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if(audioCtx.state === 'suspended') audioCtx.resume();
            }

            // 고어/타격 사운드 합성
            function playHitSound() {
                if(!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth'; // 날카로운 소리
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }

            // 개체 기본 스탯 (스태미나 추가)
            let entities = {
                killer: { x: 0, y: 0, size: 45, color: '#8a0303', vx: 0, vy: 0, hp: 100, maxHp: 100, stamina: 110, maxStamina: 110, speed: 6.5, state: 'normal', msg: '', msgTimer: 0, bleedTimer: 0, isSprinting: false }, 
                survivor: { x: 0, y: 0, size: 35, color: '#aaaaaa', vx: 0, vy: 0, hp: 110, maxHp: 110, stamina: 100, maxStamina: 100, speed: 6.5, state: 'normal', msg: '', msgTimer: 0, bleedTimer: 0, isSprinting: false }
            };

            let particles = [];
            let screenShake = 0;

            window.initHost = function() {
                initAudio(); // 클릭 시 오디오 초기화

                document.getElementById('host-init').style.display = 'none';
                document.getElementById('host-lobby').style.display = 'block';

                peer = new Peer();
                peer.on('open', (id) => {
                    let loc = window.location.href.split('?')[0];
                    if (loc.includes('localhost') || loc.includes('127.0.0.1')) {
                        const ip = prompt("모바일 접속용 로컬 IP 입력", "192.168.");
                        if (ip) loc = loc.replace(/localhost|127\.0\.0\.1/, ip);
                    }
                    new QRCode(document.getElementById("qr-container"), { text: `${loc}?join=${id}`, width: 220, height: 220, colorDark : "#000000" });
                });

                peer.on('connection', (conn) => {
                    let playerSlot = null;
                    conn.on('open', () => {
                        if (!p1Conn) {
                            p1Conn = conn; playerSlot = 'p1';
                            document.getElementById('p1-status').innerText = "장치 연결됨";
                            conn.send({ type: 'assign-role', role: isP1Killer ? 'killer' : 'survivor' });
                        } else if (!p2Conn) {
                            p2Conn = conn; playerSlot = 'p2';
                            document.getElementById('p2-status').innerText = "장치 연결됨";
                            conn.send({ type: 'assign-role', role: !isP1Killer ? 'killer' : 'survivor' });
                        }
                    });

                    conn.on('data', (data) => {
                        let role = (playerSlot === 'p1' && isP1Killer) || (playerSlot === 'p2' && !isP1Killer) ? 'killer' : 'survivor';
                        let target = entities[role];

                        if (data.type === 'ready') {
                            if (playerSlot === 'p1') p1Ready = data.state;
                            if (playerSlot === 'p2') p2Ready = data.state;
                            document.getElementById(`${playerSlot}-status`).className = data.state ? 'ready' : 'wait';
                            document.getElementById(`${playerSlot}-status`).innerText = data.state ? "준비 완료!" : "장치 연결됨";
                            
                            if (p1Ready && p2Ready && !gameActive) startMatch();
                        }
                        
                        if (!gameActive) return;

                        if (data.type === 'move') {
                            target.vx = data.x;
                            target.vy = data.y;
                        }
                        if (data.type === 'sprint') {
                            target.isSprinting = data.state;
                        }

                        if (data.type === 'skill') {
                            handleCombat(role, data.key);
                        }
                    });
                });
            };

            function showMsg(role, text) {
                entities[role].msg = text;
                entities[role].msgTimer = 60;
            }

            function getDist(p1, p2) {
                return Math.hypot(p1.x - p2.x, p1.y - p2.y);
            }

            // 피 파티클 생성기
            function addBlood(x, y) {
                for(let i=0; i<15; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 15,
                        vy: (Math.random() - 0.5) * 15,
                        life: 30 + Math.random() * 20
                    });
                }
            }

            // 전투 처리
            function handleCombat(role, key) {
                const killer = entities.killer;
                const surv = entities.survivor;
                const dist = getDist(killer, surv);
                const meleeRange = 100;

                if (role === 'killer') {
                    if (killer.state === 'stun') return;

                    if (key === 'Q') {
                        if (dist < meleeRange) {
                            applyDamage('survivor', 20);
                            surv.bleedTimer = 180; 
                        }
                    }
                    else if (key === 'E') {
                        killer.state = 'slow'; setTimeout(()=> { killer.state='normal'; }, 2000);
                        if (dist < meleeRange + 30) {
                            applyDamage('survivor', 20);
                            surv.state = 'disarm'; setTimeout(()=> { surv.state='normal'; }, 8000);
                        }
                    }
                    else if (key === 'R') {
                        if (dist < meleeRange + 10) applyDamage('survivor', 50);
                    }
                    else if (key === 'F') {
                        killer.state = 'rage';
                        screenShake = 20; // 포효 시 진동
                        setTimeout(()=> { if(killer.state==='rage') killer.state='normal'; }, 14000);
                    }
                } 
                else if (role === 'survivor') {
                    if (surv.state === 'stun' || surv.state === 'disarm') return;

                    if (key === 'Q') {
                        showMsg('survivor', '"방어!"');
                        surv.state = 'blocking';
                        setTimeout(()=> { if(surv.state==='blocking') surv.state='normal'; }, 2000);
                    }
                    else if (key === 'E') {
                        showMsg('survivor', '"돌진!"');
                        surv.x += surv.vx * 150; surv.y += surv.vy * 150; // 순간 이동기
                        if (getDist(killer, surv) < meleeRange) {
                            applyDamage('killer', 5);
                            killer.x += surv.vx * 50; killer.y += surv.vy * 50;
                        } else {
                            surv.state = 'slow'; setTimeout(()=> { surv.state='normal'; }, 2000);
                        }
                    }
                    else if (key === 'R') {
                        showMsg('survivor', '"주먹질!"');
                        if (dist < meleeRange) {
                            killer.state = 'stun'; setTimeout(()=> { killer.state='normal'; }, 2000);
                            playHitSound(); // 타격음
                        }
                    }
                }
            }

            function applyDamage(targetRole, amount) {
                const target = entities[targetRole];
                
                if (targetRole === 'survivor' && target.state === 'blocking') {
                    showMsg('survivor', '방어 성공!');
                    target.maxHp += 10;
                    target.hp += 10;
                    target.state = 'normal';
                    return; 
                }

                target.hp -= amount;
                addBlood(target.x, target.y); // 피 이펙트
                screenShake = 15; // 화면 진동
                playHitSound(); // 찢어지는 소리

                if (entities.survivor.hp <= 0) endGame('killer_win');
                if (entities.killer.hp <= 0) endGame('survivor_win');
            }

            function startMatch() {
                gameActive = true;
                document.getElementById('host-lobby').style.display = 'none';
                document.getElementById('host-game').style.display = 'block';
                
                if(p1Conn) p1Conn.send({ type: 'start-game' });
                if(p2Conn) p2Conn.send({ type: 'start-game' });

                const canvas = document.getElementById('game-canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                entities.killer.x = canvas.width * 0.2; entities.killer.y = canvas.height / 2;
                entities.survivor.x = canvas.width * 0.8; entities.survivor.y = canvas.height / 2;

                const timerInterval = setInterval(() => {
                    if (!gameActive) { clearInterval(timerInterval); return; }
                    timeRemaining--;
                    let mins = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
                    let secs = String(timeRemaining % 60).padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${mins}:${secs}`;
                    
                    if (timeRemaining <= 0) endGame('survivor_win');
                }, 1000);

                gameLoop();
            }

            function gameLoop() {
                if (!gameActive) return;
                const canvas = document.getElementById('game-canvas');
                const ctx = canvas.getContext('2d');

                // 스크린 쉐이크 적용
                ctx.save();
                if (screenShake > 0) {
                    const dx = (Math.random() - 0.5) * screenShake;
                    const dy = (Math.random() - 0.5) * screenShake;
                    ctx.translate(dx, dy);
                    screenShake -= 1;
                }

                // 배경 렌더링
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // 잔상 효과 (모션 블러)
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                for(let j=0; j<canvas.height; j+=150) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); }

                // 출혈 데미지
                if (entities.survivor.bleedTimer > 0) {
                    if (entities.survivor.bleedTimer % 60 === 0) {
                        entities.survivor.hp -= 2;
                        addBlood(entities.survivor.x, entities.survivor.y);
                    }
                    entities.survivor.bleedTimer--;
                    if (entities.survivor.hp <= 0) endGame('killer_win');
                }

                // 상태 업데이트 & 이동
                ['killer', 'survivor'].forEach(role => {
                    let p = entities[role];
                    if (p.state === 'stun' || p.state === 'disarm') return;

                    let baseSpeed = p.speed;
                    let speedMod = 1;

                    if (p.state === 'slow') speedMod = 0.5;
                    if (p.state === 'blocking') speedMod = 0.5;
                    if (role === 'killer' && p.state === 'rage') speedMod = 19 / 6.5; // 속도 19 고정

                    // 달리기 로직 (스태미나 소모 및 회복)
                    let isMoving = (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1);
                    if (p.isSprinting && p.stamina > 0 && isMoving && p.state !== 'rage') {
                        speedMod *= 1.6;
                        p.stamina = Math.max(0, p.stamina - 1); // 스태미나 소모
                    } else {
                        p.stamina = Math.min(p.maxStamina, p.stamina + 0.3); // 스태미나 회복
                    }

                    p.x += p.vx * baseSpeed * speedMod; 
                    p.y += p.vy * baseSpeed * speedMod;

                    if (p.x < p.size) p.x = p.size;
                    if (p.x > canvas.width - p.size) p.x = canvas.width - p.size;
                    if (p.y < p.size) p.y = p.size;
                    if (p.y > canvas.height - p.size) p.y = canvas.height - p.size;
                });

                // 피 파티클 렌더링
                ctx.fillStyle = '#ff0000';
                for (let i = particles.length - 1; i >= 0; i--) {
                    let pt = particles[i];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.life--;
                    ctx.globalAlpha = pt.life / 50;
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3 + Math.random()*3, 0, Math.PI*2); ctx.fill();
                    if (pt.life <= 0) particles.splice(i, 1);
                }
                ctx.globalAlpha = 1.0;

                // 플레이어 그리기
                ['killer', 'survivor'].forEach(role => {
                    let p = entities[role];
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    
                    if (p.state === 'blocking') ctx.fillStyle = '#555'; 
                    if (p.state === 'stun' || p.state === 'disarm') ctx.fillStyle = '#333';
                    
                    // 살인마 격노 효과 (붉은 오라)
                    if (p.state === 'rage') {
                        ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
                        ctx.fillStyle = '#ff0000';
                    }
                    
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // 하키 마스크 데코레이션 (살인마)
                    if (role === 'killer') {
                        ctx.fillStyle = '#ddd';
                        ctx.beginPath(); ctx.arc(p.x - 12, p.y - 8, 4, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(p.x + 12, p.y - 8, 4, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(p.x, p.y + 12, 4, 0, Math.PI*2); ctx.fill();
                    }

                    // UI 바 (체력 & 스태미나)
                    // HP
                    ctx.fillStyle = '#440000';
                    ctx.fillRect(p.x - 40, p.y - p.size - 25, 80, 6);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(p.x - 40, p.y - p.size - 25, 80 * (Math.max(0, p.hp) / p.maxHp), 6);
                    // 스태미나
                    ctx.fillStyle = '#113311';
                    ctx.fillRect(p.x - 40, p.y - p.size - 15, 80, 4);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(p.x - 40, p.y - p.size - 15, 80 * (Math.max(0, p.stamina) / p.maxStamina), 4);

                    // 대사 팝업
                    if (p.msgTimer > 0) {
                        ctx.fillStyle = (role === 'killer') ? '#ff3333' : '#ddd';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(p.msg, p.x, p.y - p.size - 40 - (60 - p.msgTimer)*0.5);
                        p.msgTimer--;
                    }
                });

                ctx.restore(); // 스크린 쉐이크 복구
                requestAnimationFrame(gameLoop);
            }

            function endGame(result) {
                gameActive = false;
                const ctx = document.getElementById('game-canvas').getContext('2d');
                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 50px sans-serif';
                ctx.textAlign = 'center';

                if (result === 'survivor_win') {
                    ctx.fillStyle = '#aaaaaa';
                    ctx.fillText("Guest 1337 생존 성공! (73초 버팀)", window.innerWidth/2, window.innerHeight/2);
                } else {
                    ctx.fillStyle = '#ff0000';
                    ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
                    ctx.fillText("Slasher 승리! (처단 완료)", window.innerWidth/2, window.innerHeight/2);
                }
            }
        }
    </script>
</body>
